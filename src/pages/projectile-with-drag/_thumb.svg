<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <!-- 같은 발사 두 경로. 위젯과 같은 색 뜻: 공기 있는 경로 = --series-1(실선), 공기 뺀 경로 = --series-2(점선). 점선은 좌우 대칭 포물선, 실선은 같은 방향으로 출발해 더 낮게 오르고 더 가파르게 떨어져 짧게 착지한다. 바닥 = 회색 선. 글자·숫자 없음 -->
  <rect width="320" height="200" style="fill:var(--steel-100)"/>
  <path d="M0 20H320M0 40H320M0 60H320M0 80H320M0 100H320M0 120H320M0 140H320M0 160H320M0 180H320M20 0V200M40 0V200M60 0V200M80 0V200M100 0V200M120 0V200M140 0V200M160 0V200M180 0V200M200 0V200M220 0V200M240 0V200M260 0V200M280 0V200M300 0V200" style="fill:none;stroke:var(--steel-200);stroke-width:1"/>
  <path d="M12 176H308" style="fill:none;stroke:var(--steel-400);stroke-width:1.5"/>
  <path d="M24 176Q160 -96 296 176" style="fill:none;stroke:var(--series-2);stroke-width:2.5;stroke-dasharray:6 5;stroke-linecap:round"/>
  <path d="M24 176C74 76 168 34 212 176" style="fill:none;stroke:var(--series-1);stroke-width:3;stroke-linecap:round"/>
</svg>
