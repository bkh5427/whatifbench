<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <!-- 공유기(왼쪽)에서 나온 두 대역의 신호 선. 2.4 GHz = --series-1(실선), 5 GHz = --series-2(굵은 실선) — 5 GHz가 벽 없이도 아래에서 출발하고, 같은 벽 두 장(회색 기둥)마다 같은 폭으로, 2.4 GHz보다 크게 떨어진다(콘크리트 방향). 글자·숫자 없음 -->
  <rect width="320" height="200" style="fill:var(--steel-100)"/>
  <path d="M0 20H320M0 40H320M0 60H320M0 80H320M0 100H320M0 120H320M0 140H320M0 160H320M0 180H320M20 0V200M40 0V200M60 0V200M80 0V200M100 0V200M120 0V200M140 0V200M160 0V200M180 0V200M200 0V200M220 0V200M240 0V200M260 0V200M280 0V200M300 0V200" style="fill:none;stroke:var(--steel-200);stroke-width:1"/>
  <rect x="24" y="92" width="32" height="24" rx="3" style="fill:var(--steel-300);stroke:var(--graphite-soft);stroke-width:1.5"/>
  <path d="M31 92L28 76M49 92L52 76" style="fill:none;stroke:var(--graphite-soft);stroke-width:2;stroke-linecap:round"/>
  <rect x="126" y="24" width="10" height="160" style="fill:var(--steel-400)"/>
  <rect x="206" y="24" width="10" height="160" style="fill:var(--steel-400)"/>
  <path d="M60 44L126 58L136 74L206 88L216 104L300 122" style="fill:none;stroke:var(--series-1);stroke-width:2.5;stroke-linejoin:round"/>
  <path d="M60 60L126 74L136 104L206 118L216 148L300 166" style="fill:none;stroke:var(--series-2);stroke-width:4;stroke-linejoin:round"/>
</svg>
